<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17202d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="敵部隊DB" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>敵部隊データベース</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <div class="boot-screen">
        <div class="brand-mark" aria-hidden="true">DB</div>
        <p>読み込み中...</p>
      </div>
    </div>

    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>

    <dialog id="image-dialog" class="image-dialog">
      <div class="dialog-toolbar">
        <strong>戦報画像</strong>
        <button type="button" class="icon-button" data-action="close-image-dialog" aria-label="閉じる">×</button>
      </div>
      <div class="image-dialog-body">
        <img id="dialog-image" alt="アップロードした戦報画像" />
      </div>
    </dialog>

    <dialog id="code-dialog" class="code-dialog">
      <div class="dialog-toolbar">
        <strong>アクセスコード</strong>
        <button type="button" class="icon-button" data-action="close-code-dialog" aria-label="閉じる">×</button>
      </div>
      <div class="code-dialog-body">
        <p class="muted">このコードは再表示できません。対象者へ安全な方法で渡してください。</p>
        <output id="issued-code" class="issued-code"></output>
        <button type="button" class="primary-button" data-action="copy-issued-code">コードをコピー</button>
      </div>
    </dialog>

    <template id="loading-template">
      <div class="loading-overlay" role="status" aria-live="assertive">
        <div class="spinner" aria-hidden="true"></div>
        <strong data-loading-label>処理中...</strong>
        <small>画面を閉じずにお待ちください</small>
      </div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
